<svg xmlns="http://www.w3.org/2000/svg" width="560" height="150" viewBox="0 0 560 150">
  <style>
    text { font-family: 'Courier New', Consolas, monospace; font-size: 20px; }
    .t { fill: #e6edf3; }
    .r0, .r1, .r2, .r3 { width: 0; height: 34px; }
    .r0 { animation: a0 20s infinite; }
    .r1 { animation: a1 20s infinite; }
    .r2 { animation: a2 20s infinite; }
    .r3 { animation: a3 20s infinite; }

    @keyframes a0 {
      0%   { width: 0;     animation-timing-function: steps(20, end); }
      9%   { width: 240px; }
      19%  { width: 240px; animation-timing-function: steps(20, end); }
      24%  { width: 0; }
      100% { width: 0; }
    }
    @keyframes a1 {
      0%   { width: 0; }
      25%  { width: 0;     animation-timing-function: steps(31, end); }
      34%  { width: 372px; }
      44%  { width: 372px; animation-timing-function: steps(31, end); }
      49%  { width: 0; }
      100% { width: 0; }
    }
    @keyframes a2 {
      0%   { width: 0; }
      50%  { width: 0;     animation-timing-function: steps(25, end); }
      59%  { width: 300px; }
      69%  { width: 300px; animation-timing-function: steps(25, end); }
      74%  { width: 0; }
      100% { width: 0; }
    }
    @keyframes a3 {
      0%   { width: 0; }
      75%  { width: 0;     animation-timing-function: steps(32, end); }
      84%  { width: 384px; }
      94%  { width: 384px; animation-timing-function: steps(32, end); }
      99%  { width: 0; }
      100% { width: 0; }
    }
  </style>

  <defs>
    <clipPath id="c0"><rect class="r0" x="52" y="74"/></clipPath>
    <clipPath id="c1"><rect class="r1" x="52" y="74"/></clipPath>
    <clipPath id="c2"><rect class="r2" x="52" y="74"/></clipPath>
    <clipPath id="c3"><rect class="r3" x="52" y="74"/></clipPath>
  </defs>

  <!-- ventana -->
  <rect x="1" y="1" width="558" height="148" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="558" height="34" rx="10" fill="#161b22"/>
  <rect x="1" y="20" width="558" height="15" fill="#161b22"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="18" r="6" fill="#27c93f"/>
  <text x="280" y="23" font-size="13" fill="#8b949e" text-anchor="middle">victor@celaya: ~</text>

  <!-- prompt -->
  <text x="28" y="98" fill="#3fb950">$</text>

  <!-- frases -->
  <text class="t" x="52" y="98" clip-path="url(#c0)">Full Stack Developer</text>
  <text class="t" x="52" y="98" clip-path="url(#c1)">Ingeniero de datos en formación</text>
  <text class="t" x="52" y="98" clip-path="url(#c2)">Ganador de InnovaTec 2025</text>
  <text class="t" x="52" y="98" clip-path="url(#c3)">git commit -m 'sigo aprendiendo'</text>
</svg>
